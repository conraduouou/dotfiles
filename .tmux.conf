# ===============================
# TMUX CONF: THE ALT-HJKL PHILOSOPHY
# ===============================

# --------- General Settings ----------
# Use Alt (Meta) as main modifier; CapsLock is Esc already
# Ensure Kitty is set: macos_option_as_alt yes
set-option -g prefix M-b         # optional prefix, can still keep Ctrl-b if desired
unbind C-b                        # unbind default prefix
bind M-b send-prefix              # keep ability to send prefix

# --------- Pane Navigation ----------
# Alt + hjkl to move between panes instantly (no prefix required)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# --------- Pane Resizing (requires prefix) ----------
# Coarse resizing (prefix + Alt + hjkl)
bind -r M-H resize-pane -L 5
bind -r M-J resize-pane -D 5
bind -r M-K resize-pane -U 5
bind -r M-L resize-pane -R 5

# Prefix + Alt-hjkl to resize continuously if you hold the key
bind -r M-h resize-pane -L 1
bind -r M-j resize-pane -D 1
bind -r M-k resize-pane -U 1
bind -r M-l resize-pane -R 1

# --------- Window Navigation ----------
# Alt + t → new window
bind-key -n M-t new-window

# Alt + w → close window with confirmation
bind-key -n M-w confirm-before -p "Kill window? (y/n)" kill-window

# Alt + [ / ] → previous / next window (already existing)
bind-key -n M-'[' previous-window
bind-key -n M-']' next-window

# Alt + 0-9 → jump to window by number
bind-key -n M-0 select-window -t :0
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# --------- Quick Splits ----------
# Alt + ; → horizontal split (prefix optional)
bind-key -n M-';' split-window -h

# Alt + ' → vertical split (prefix optional)
bind-key -n M-\' split-window -v

# -------- Rotate panes -----------
bind-key -n M-'|' rotate-window
bind-key -n M-'\' rotate-window -D

# --------- Status & Appearance ----------
# Optional: show window and pane indices clearly
set-option -g status on
set-option -g status-interval 2
set-option -g status-left-length 40
set-option -g status-right-length 100
# set-option -g status-left "#[fg=green]#S"
# set-option -g status-right "#[fg=yellow]%Y-%m-%d %H:%M #[fg=cyan]#h"

# --------- Copy Mode (Vim-style) ----------
setw -g mode-keys vi              # vi keybindings for copy mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi M-u send-keys -X halfpage-up
bind-key -T copy-mode-vi M-d send-keys -X halfpage-down
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
