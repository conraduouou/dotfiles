# ===============================
# TMUX CONF: THE ALT-HJKL PHILOSOPHY
# ===============================

set -s extended-keys on
set -s extended-keys-format csi-u

# --------- General Settings ----------
# !! REVERTED TO CTRL !!
#
# Use Alt (Meta) as main modifier; CapsLock is Esc already
# Ensure Kitty is set: macos_option_as_alt yes
# set-option -g prefix M-b          # optional prefix, can still keep Ctrl-b if desired
# unbind C-b                        # unbind default prefix
# bind M-b send-prefix              # keep ability to send prefix

# For the vim-tmux-navigator plugin to work
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# PS: @fzf-active is being set by my fzf functions in functions.zsh
set -g @is_vim '#{m|ri:^(g?\.?(view|l?n?vim?x?|fzf))(diff)?(-wrapped)?$,#{pane_current_command}}'
bind-key -n C-h if-shell -F '#{E:@is_vim}' 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell -F '#{||:#{E:@is_vim},#{@fzf-active}}' 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell -F '#{||:#{E:@is_vim},#{@fzf-active}}' 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell -F '#{E:@is_vim}' 'send-keys C-l' 'select-pane -R'
bind-key -n C-\\ if-shell -F '#{E:@is_vim}' 'send-keys C-\\\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --------- Navigation ----------

# Ctrl + [ / ] → previous / next window (already existing)
bind-key -n C-'[' previous-window
bind-key -n C-']' next-window

# Ctrl + 0-9 → jump to window by number
bind-key -n C-0 select-window -t :0
bind-key -n C-1 select-window -t :1
bind-key -n C-2 select-window -t :2
bind-key -n C-3 select-window -t :3
bind-key -n C-4 select-window -t :4
bind-key -n C-5 select-window -t :5
bind-key -n C-6 select-window -t :6
bind-key -n C-7 select-window -t :7
bind-key -n C-8 select-window -t :8
bind-key -n C-9 select-window -t :9

# --------- Pane Resizing ----------
# Prefix + hjkl → fine resize (repeatable)
bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# Prefix + HJKL → coarse resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --------- Window Management ----------
# Prefix + t → new window
bind t new-window

# Prefix + w → close current window (with confirmation)
bind w confirm-before -p "Kill window? (y/n)" kill-window

# --------- Splits ----------
# Prefix + ; → horizontal split
bind ";" split-window -h

# Prefix + ' → vertical split
bind "'" split-window -v

# --------- Rotate Panes ----------

# Prefix + | → rotate panes forward
bind -r "|" rotate-window -U

# Prefix + \ → rotate panes backward
bind -r \\ rotate-window

# --------- Swap Panes ----------
# Prefix + } → swap-panes forward
bind -r "}" swap-pane -U

# Prefix + } → swap-panes backward
bind -r "]" swap-pane

# --------- Copy Mode and Paste Buffer ----------
# Prefix + } → initiate copy mode
bind "[" copy-mode

# Prefix + } → open paste buffer
bind "{" paste-buffer 

# --------- Status & Appearance ----------
# Optional: show window and pane indices clearly
set-option -g status on
set-option -g status-interval 2
set-option -g status-left-length 40
set-option -g status-right-length 100
# set-option -g status-left "#[fg=green]#S"
# set-option -g status-right "#[fg=yellow]%Y-%m-%d %H:%M #[fg=cyan]#h"

# --------- Copy Mode (Vim-style) ----------
set -g mode-keys vi              # vi keybindings for copy mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
